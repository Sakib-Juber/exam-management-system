<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Exam Management System</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="auth-container">

    <div class="card">

      <h1>Login</h1>

      <p class="muted">
        Login to your account.
      </p>


      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
        >


        <label for="role">
          Login As
        </label>

        <select id="role" required>

          <option value="">
            Select role
          </option>

          <option value="student">
            Student
          </option>

          <option value="admin">
            Admin
          </option>

        </select>


        <button
          type="submit"
          class="button full"
        >
          Login
        </button>

      </form>


      <p id="message" class="message"></p>


      <p class="auth-footer">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>

    </div>

  </div>


  <script src="auth.js"></script>

</body>
</html>
