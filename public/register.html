<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register - Exam Management System</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="auth-container">

    <div class="card">

      <h1>Create Account</h1>

      <p class="muted">
        Register as an Admin or Student.
      </p>


      <form id="registerForm">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          required
        >


        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
          minlength="6"
        >


        <label for="role">
          Register As
        </label>

        <select id="role" required>

          <option value="">
            Select role
          </option>

          <option value="student">
            Student
          </option>

          <option value="admin">
            Admin
          </option>

        </select>


        <div id="studentFields" class="hidden">

          <label for="year">
            Academic Year
          </label>

          <select id="year">

            <option value="">
              Select year
            </option>

            <option value="1">
              First Year
            </option>

            <option value="2">
              Second Year
            </option>

            <option value="3">
              Third Year
            </option>

            <option value="4">
              Fourth Year
            </option>

          </select>


          <label for="section">
            Section
          </label>

          <input
            type="text"
            id="section"
            placeholder="Example: A"
            maxlength="5"
          >

        </div>


        <button
          type="submit"
          class="button full"
        >
          Register
        </button>

      </form>


      <p id="message" class="message"></p>


      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </div>


  <script src="auth.js"></script>

</body>
</html>
